name: Build Screamer
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MinGW
        run: choco install mingw -y
      - name: Build
        run: |
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" ..
          mingw32-make
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screamer-package
          path: build/*.exe
